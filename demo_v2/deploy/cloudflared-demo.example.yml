tunnel: REPLACE_WITH_DEDICATED_TUNNEL_UUID
credentials-file: /etc/cloudflared/polymarket-demo-v2.json
ingress:
  - hostname: demo-poly.dvirtechnologies.com
    service: http://127.0.0.1:8080
    originRequest:
      httpHostHeader: demo-poly.dvirtechnologies.com
