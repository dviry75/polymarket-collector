# Install as /etc/nginx/snippets/polymarket-demo-v2-api.conf after approval.
# No trailing URI: preserve /demo/api/v1/... exactly.
proxy_pass http://127.0.0.1:8010;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx is the sole direct-HTTPS ingress in this proposal; discard client XFF.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# Both approved exposure profiles require browser HTTPS.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_cache off;
proxy_cache_bypass 1;
proxy_no_cache 1;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
# REST polling only. No WebSocket, cookie rewriting or Access-Control-* headers.
